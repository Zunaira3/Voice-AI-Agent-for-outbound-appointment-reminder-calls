<!DOCTYPE html>
<html>
<head>
    <title>Voice AI Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { font-size: 28px; margin-bottom: 8px; }
        .subtitle { color: #666; margin-bottom: 32px; }
        input, button {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { transform: translateY(-2px); }
        .status { margin-top: 16px; padding: 12px; border-radius: 12px; display: none; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📞 Voice AI Agent</h1>
        <p class="subtitle">Appointment Reminder</p>
        
        <input type="tel" id="phone" placeholder="+1234567890">
        <input type="text" id="name" placeholder="Customer name (optional)">
        <input type="text" id="date" placeholder="Appointment date (optional)">
        <button id="callBtn">📞 Make Call</button>
        <div id="status" class="status"></div>
    </div>
    
    <script>
        document.getElementById('callBtn').onclick = async () => {
            const btn = document.getElementById('callBtn');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            btn.textContent = '⏳ Calling...';
            
            try {
                const phone = document.getElementById('phone').value;
                const name = document.getElementById('name').value;
                const date = document.getElementById('date').value;
                
                const res = await fetch('/api/call/initiate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: `phone_number=${encodeURIComponent(phone)}&customer_name=${encodeURIComponent(name)}&appointment_date=${encodeURIComponent(date)}`
                });
                
                const data = await res.json();
                
                if (data.success) {
                    status.className = 'status success';
                    status.style.display = 'block';
                    status.textContent = `✅ ${data.message}`;
                } else {
                    throw new Error(data.error);
                }
            } catch (err) {
                status.className = 'status error';
                status.style.display = 'block';
                status.textContent = `❌ ${err.message}`;
            } finally {
                btn.disabled = false;
                btn.textContent = '📞 Make Call';
                setTimeout(() => status.style.display = 'none', 5000);
            }
        };
    </script>
</body>
</html>
